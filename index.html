<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compiler vs Interpreter: Orbital Launch</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --text: #f8fafc;
            --primary: #3b82f6;
            --accent: #f59e0b;
            --success: #10b981;
            --error: #ef4444;
            --border: #334155;
            --space: #020617;
            --sky: #38bdf8;
            --earth: #166534;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .widget-container {
            width: 100%;
            max-width: 1200px;
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            padding: 20px;
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }
        
        /* Instructions Panel */
        .instructions {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid var(--primary);
        }
        .instructions h3 { margin-top: 0; color: var(--sky); margin-bottom: 10px; }
        .instructions p { margin: 0 0 10px 0; line-height: 1.5; }
        .instructions ul { margin: 0; padding-left: 20px; color: #cbd5e1; }
        .instructions li { margin-bottom: 6px; }

        .timers {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 20px;
        }
        .timer-box {
            background: #000;
            padding: 15px 30px;
            border-radius: 8px;
            border: 2px solid #334155;
            text-align: center;
        }
        .timer-label { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .timer-value { font-family: 'Courier New', monospace; font-size: 32px; color: var(--success); font-weight: bold; }
        
        .grid {
            display: grid;
            grid-template-columns: 350px 1fr 300px;
            gap: 20px;
            position: relative;
        }
